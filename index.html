
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#121619">

    <meta name="description"
          content="Antinomia.fork — Economia, filosofia, história, ciência e política. O mundo poderia ser diferente.">

    <title>antinomia.fork</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Símbolo reutilizável de ramificação -->
    <svg class="svg-definitions"
         xmlns="http://www.w3.org/2000/svg">

        <symbol id="git-branch" viewBox="0 0 24 24">
            <g fill="none"
               stroke="currentColor"
               stroke-width="1.6"
               stroke-linecap="round"
               stroke-linejoin="round">

                <circle cx="6" cy="5" r="2.5"/>
                <circle cx="18" cy="7" r="2.5"/>
                <circle cx="6" cy="19" r="2.5"/>

                <path d="M6 7.5v9"/>
                <path d="M18 9.5c0 5-12 2-12 7"/>

            </g>
        </symbol>

    </svg>

    <main class="page">

        <div class="profile-card">

            <!-- CABEÇALHO -->

            <header class="profile-header">

                <svg class="logo"
                     viewBox="0 0 100 100"
                     xmlns="http://www.w3.org/2000/svg"
                     aria-label="Logo antinomia.fork"
                     role="img">

                    <path
                        d="M30 16 V67 Q30 82 46 82 H76
                           M30 40 Q30 25 46 25 H76"
                        fill="none"
                        stroke="#B4E578"
                        stroke-width="4"
                        stroke-linecap="round"
                    />

                    <circle cx="30" cy="16"
                            r="7" fill="#F4F4F4"/>

                    <circle cx="76" cy="25"
                            r="7" fill="#B4E578"/>

                    <circle cx="76" cy="82"
                            r="7" fill="#F4F4F4"/>

                </svg>

                <h1>
                    antinomia<span>.fork</span>
                </h1>

                <p class="tagline">
                    O mundo poderia ser diferente.
                </p>

            </header>

            <div class="divider"></div>

            <!-- DIRETÓRIO -->

            <div class="directory">
                ~/antinomia.fork/links
            </div>

            <!-- REDES SOCIAIS -->

            <nav class="links" aria-label="Redes sociais">

                <!-- YOUTUBE -->

                <a class="link-card"
                   href="https://www.youtube.com/channel/UCaKMqy9r4Vb5FsnAvEiLpFQ"
                   target="_blank"
                   rel="noopener noreferrer">

                    <svg class="branch-icon">
                        <use href="#git-branch"/>
                    </svg>

                    <div class="link-content">
                        <h2>YouTube</h2>
                        <p>vídeos completos e animações</p>
                    </div>

                    <span class="external-arrow"
                          aria-hidden="true">↗</span>

                </a>

                <!-- INSTAGRAM -->

                <a class="link-card"
                   href="https://www.instagram.com/antinomia.fork/"
                   target="_blank"
                   rel="noopener noreferrer">

                    <svg class="branch-icon">
                        <use href="#git-branch"/>
                    </svg>

                    <div class="link-content">
                        <h2>Instagram</h2>
                        <p>reels, conteúdos e atualizações</p>
                    </div>

                    <span class="external-arrow"
                          aria-hidden="true">↗</span>

                </a>

                <!-- TIKTOK -->

                <a class="link-card"
                   href="https://www.tiktok.com/@antinomia.fork"
                   target="_blank"
                   rel="noopener noreferrer">

                    <svg class="branch-icon">
                        <use href="#git-branch"/>
                    </svg>

                    <div class="link-content">
                        <h2>TikTok</h2>
                        <p>cortes e vídeos curtos</p>
                    </div>

                    <span class="external-arrow"
                          aria-hidden="true">↗</span>

                </a>

                <!-- APOIA.SE -->

                <a class="link-card"
                   href="https://apoia.se/antinomiafork"
                   target="_blank"
                   rel="noopener noreferrer">

                    <svg class="branch-icon">
                        <use href="#git-branch"/>
                    </svg>

                    <div class="link-content">
                        <h2>APOIA.se</h2>
                        <p>apoie o projeto e o próximo fork</p>
                    </div>

                    <span class="external-arrow"
                          aria-hidden="true">↗</span>

                </a>

            </nav>

            <div class="divider"></div>

            <!-- RODAPÉ -->

            <footer class="profile-footer">
                status: building · more commits soon<span
                    class="cursor">_</span>
            </footer>

        </div>

    </main>

</body>
</html>
